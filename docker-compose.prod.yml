# ====================================================================
# NugaCore — docker-compose para PRODUCCIÓN
# Construye la imagen multistage y la ejecuta con secretos por entorno.
# Pensado para un VPS o como referencia para Coolify.
#
# Uso:
#   1. Copia .env.production.example a .env y rellena los valores.
#   2. docker compose -f docker-compose.prod.yml up -d --build
#
# Para revisar la config sin imprimir secretos expandidos:
#   npm run docker:config:safe
# Evita publicar la salida de `docker compose config` sin `--no-interpolate`.
#
# BUILD-ONCE / DEPLOY-MANY: la imagen ya NO recibe configuración de Supabase
# en build-time. La URL y la anon key se sirven en runtime desde
# /runtime-config.js, así que el mismo digest se promueve entre ambientes
# cambiando sólo variables del contenedor. Ver docs/operations/RELEASING.md.
# ====================================================================

services:
  nugacore:
    # Referencia local. En un despliegue real se usa la imagen publicada POR
    # DIGEST (ghcr.io/nugacorp/nugacore-v2@sha256:...), nunca una etiqueta
    # mutable. Ver docs/operations/RELEASING.md.
    build:
      context: .
      dockerfile: Dockerfile
    image: nugacore:local
    container_name: nugacore
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Configuración PÚBLICA servida al navegador en /runtime-config.js.
      # Son los únicos valores del entorno que el cliente llega a ver.
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:-}"
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
