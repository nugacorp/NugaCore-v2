name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate migration filenames and unique versions
        run: npm run validate:migration-files

      - name: Lint (ESLint)
        run: npx eslint .

      - name: Type check
        run: npm run typecheck

      - name: Contract tests (API v1)
        run: npm test

      - name: Production build
        run: npm run build
