name: Production Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  production-readiness-local:
    name: Production readiness (local gates)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate production env template exists
        run: test -f .env.production.example
      - name: Validate production scripts
        run: |
          test -x scripts/smoke-production.sh || chmod +x scripts/smoke-production.sh
          test -f scripts/validate-production-readiness.mjs
          test -f scripts/vps/validate-production.sh
      - name: Local readiness (expects failures without prod env)
        run: node scripts/validate-production-readiness.mjs || true

  # `npm test` es hermético y sobre la migración del webhook sólo puede afirmar
  # presencia de texto. Los invariantes que importan —privilegios mínimos de
  # service_role, el UPDATE que exige `SELECT … FOR UPDATE`, el arbiter del
  # ON CONFLICT y el winner único bajo carrera real— sólo se observan en un
  # PostgreSQL de verdad. Sin este job, retirar un GRANT o reordenar los locks
  # pasaría CI en verde.
  webhook-postgres17:
    name: Webhook idempotency · PostgreSQL 17 real
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # El runner ya trae Docker; el script levanta y elimina su propio
      # contenedor desechable, así que no hace falta un `services:` compartido
      # (el fixture necesita dblink sobre el socket local del propio servidor).
      - run: npm run test:db:postgres17 -- webhook

  # Borrar un cliente atraviesa 25 tablas con acciones referenciales mezcladas
  # (RESTRICT, CASCADE y SET NULL), y `npm test` corre en modo mock, donde las
  # filas van a un array sin claves foráneas: un defecto de integridad pasaría
  # invisible. Este job fija la línea base referencial de HOY para que el
  # borrado transaccional (T2) se contraste contra ella en vez de contra el
  # recuerdo de lo que el esquema decía.
  customer-delete-postgres17:
    name: Customer delete baseline · PostgreSQL 17 real
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:db:postgres17 -- customer-delete

  # Durante 22 días el esquema no se pudo reconstruir desde cero y nadie se
  # enteró: `npm test` corre en modo mock y ningún gate aplicaba el historial
  # completo. Sin esto, el estado real de la base no es reproducible desde el
  # repositorio — no se puede levantar un entorno nuevo sin intervención manual
  # y la recuperación ante desastre depende del backup, no del código.
  schema-replay-postgres17:
    name: Esquema reconstruible desde cero · PostgreSQL 17 real
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:db:postgres17 -- schema-replay

  security-smoke:
    name: Security contract tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/contract/payments.webhook-hardening.test.ts tests/contract/gis.rbac.test.ts tests/contract/production-readiness.contract.test.ts
