name: Production Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate migration filenames and unique versions
        run: npm run validate:migration-files
      - run: npx eslint .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  production-readiness-local:
    name: Production readiness (local gates)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate production env template exists
        run: test -f .env.production.example
      - name: Validate production scripts
        run: |
          test -x scripts/smoke-production.sh || chmod +x scripts/smoke-production.sh
          test -f scripts/validate-production-readiness.mjs
          test -f scripts/vps/validate-production.sh
      - name: Local readiness (expects failures without prod env)
        run: node scripts/validate-production-readiness.mjs || true

  # `npm test` corre el servidor en proceso: nunca demuestra que la IMAGEN
  # arranque, que el usuario no-root pueda leer `dist/`, ni que
  # /runtime-config.js entregue la configuración inyectada al contenedor.
  #
  # Este smoke es HERMÉTICO: construye, arranca y consulta la imagen en local
  # con valores falsos. No publica nada y no contacta Supabase, MikroTik ni
  # ningún proveedor. NO es una validación de staging ni de producción.
  container-smoke:
    name: Imagen y contenedor · smoke hermético
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t nugacore:ci-smoke .

      - name: Run container and verify runtime config
        env:
          # Valores PÚBLICOS falsos: deben aparecer en /runtime-config.js.
          FAKE_SUPABASE_URL: https://smoke.supabase.invalid
          FAKE_ANON_KEY: anon-smoke-public-value
          # Marcador de SECRETO: no debe aparecer NUNCA en la respuesta.
          FAKE_SERVICE_ROLE: SERVICE-ROLE-MARKER-MUST-NOT-LEAK
        run: |
          set -euo pipefail

          CID=""
          cleanup() {
            if [ -n "$CID" ]; then
              docker logs "$CID" 2>&1 | tail -40 || true
              docker rm -f "$CID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          # Puerto efímero asignado por el kernel: evita colisiones con otros
          # jobs o servicios del runner.
          CID=$(docker run -d -P \
            -e SUPABASE_URL="$FAKE_SUPABASE_URL" \
            -e SUPABASE_ANON_KEY="$FAKE_ANON_KEY" \
            -e SUPABASE_SERVICE_ROLE_KEY="$FAKE_SERVICE_ROLE" \
            -e SUPABASE_SECRET_KEY="$FAKE_SERVICE_ROLE" \
            -e DATABASE_URL="$FAKE_SERVICE_ROLE" \
            -e MIKROTIK_CREDENTIALS_KEY="$FAKE_SERVICE_ROLE" \
            -e WEBHOOK_SECRET_MANUAL="$FAKE_SERVICE_ROLE" \
            nugacore:ci-smoke)

          PORT=$(docker port "$CID" 3000/tcp | head -1 | sed 's/.*://')
          echo "container=$CID port=$PORT"

          # Espera acotada: 60 intentos de 1s. Nunca indefinida.
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/health/live" >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::el contenedor no respondió /api/health/live en 60s"
            exit 1
          fi
          echo "health OK tras ${i}s"

          BODY=$(curl -fsS -D /tmp/rc-headers "http://127.0.0.1:${PORT}/runtime-config.js")
          echo "--- /runtime-config.js ---"
          echo "$BODY"

          grep -qi '^cache-control: *no-store' /tmp/rc-headers \
            || { echo "::error::falta Cache-Control: no-store"; exit 1; }
          grep -qi '^content-type: *application/javascript' /tmp/rc-headers \
            || { echo "::error::content-type inesperado"; exit 1; }

          echo "$BODY" | grep -q "$FAKE_SUPABASE_URL" \
            || { echo "::error::la URL pública inyectada no aparece"; exit 1; }
          echo "$BODY" | grep -q "$FAKE_ANON_KEY" \
            || { echo "::error::la anon key pública inyectada no aparece"; exit 1; }

          if echo "$BODY" | grep -q "$FAKE_SERVICE_ROLE"; then
            echo "::error::FUGA DE SECRETO: el marcador service-role apareció en /runtime-config.js"
            exit 1
          fi
          echo "smoke OK: config pública presente, secretos ausentes"

  # `npm test` es hermético y sobre la migración del webhook sólo puede afirmar
  # presencia de texto. Los invariantes que importan —privilegios mínimos de
  # service_role, el UPDATE que exige `SELECT … FOR UPDATE`, el arbiter del
  # ON CONFLICT y el winner único bajo carrera real— sólo se observan en un
  # PostgreSQL de verdad. Sin este job, retirar un GRANT o reordenar los locks
  # pasaría CI en verde.
  webhook-postgres17:
    name: Webhook idempotency · PostgreSQL 17 real
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # El runner ya trae Docker; el script levanta y elimina su propio
      # contenedor desechable, así que no hace falta un `services:` compartido
      # (el fixture necesita dblink sobre el socket local del propio servidor).
      - run: npm run test:db:postgres17 -- webhook

  # Borrar un cliente atraviesa 25 tablas con acciones referenciales mezcladas
  # (RESTRICT, CASCADE y SET NULL), y `npm test` corre en modo mock, donde las
  # filas van a un array sin claves foráneas: un defecto de integridad pasaría
  # invisible. Este job fija la línea base referencial de HOY para que el
  # borrado transaccional (T2) se contraste contra ella en vez de contra el
  # recuerdo de lo que el esquema decía.
  customer-delete-postgres17:
    name: Customer delete baseline · PostgreSQL 17 real
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:db:postgres17 -- customer-delete

  # Durante 22 días el esquema no se pudo reconstruir desde cero y nadie se
  # enteró: `npm test` corre en modo mock y ningún gate aplicaba el historial
  # completo. Sin esto, el estado real de la base no es reproducible desde el
  # repositorio — no se puede levantar un entorno nuevo sin intervención manual
  # y la recuperación ante desastre depende del backup, no del código.
  schema-replay-postgres17:
    name: Esquema reconstruible desde cero · PostgreSQL 17 real
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:db:postgres17 -- schema-replay

  # La config del portal vivía en un Map y se reseteaba en cada redeploy: un
  # WISP que apagaba "ver saldo" se lo encontraba encendido al día siguiente.
  # `npm test` no puede demostrar el arreglo — en modo mock el respaldo en
  # memoria se comporta igual que la tabla.
  portal-config-postgres17:
    name: Config del portal persiste · PostgreSQL 17 real
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:db:postgres17 -- portal-config

  contract-sign-postgres17:
    name: Contract signing invariants · PostgreSQL 17 real
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:db:postgres17 -- contract-sign

  # La reactivación automática por pago sólo puede declarar `eligible` si el
  # bloqueo financiero del motor existe, y su idempotencia descansa por
  # completo en el índice único parcial (tenant_id, evidence_type, evidence_id).
  # `npm test` corre en modo mock: ahí el respaldo en memoria no puede
  # demostrar la RLS, la ACL mínima (service_role SIN DELETE) ni esa unicidad,
  # así que retirar un GRANT o el índice pasaría CI en verde y sólo se notaría
  # con clientes reales duplicando o filtrando bloqueos entre WISPs.
  # `schema-replay` aplica las migraciones, pero NO ejecuta estos asserts.
  customer-suspension-blocks-postgres17:
    name: Customer suspension blocks · PostgreSQL 17 real
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:db:postgres17 -- customer-suspension-blocks

  security-smoke:
    name: Security contract tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/contract/payments.webhook-hardening.test.ts tests/contract/gis.rbac.test.ts tests/contract/production-readiness.contract.test.ts
